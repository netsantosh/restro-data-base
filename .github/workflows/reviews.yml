name: reviews

# Reads a few Google Maps review texts per restaurant (headless Chrome) into claude-website/review_cache.
# The cache is restored by the site build, so reviews appear on restaurant pages after the next deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"      # weekly, Monday 02:00 IST

permissions:
  contents: read
  actions: write

concurrency:
  group: reviews
  cancel-in-progress: false

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DB_SHEET_ID: ${{ secrets.DB_SHEET_ID }}

jobs:
  reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claude-website/requirements.txt
      - run: pip install -r claude-website/requirements.txt
      - name: Restore review cache
        uses: actions/cache/restore@v4
        with:
          path: claude-website/review_cache
          key: review-cache-${{ github.run_id }}-0
          restore-keys: review-cache-
      - name: Collect reviews
        working-directory: claude-website
        run: python review_sync.py --minutes 280 --workers 3
      - name: Save review cache
        if: always()
        uses: actions/cache/save@v4
        with: { path: claude-website/review_cache, key: "review-cache-${{ github.run_id }}-1" }
      - name: Publish site
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run claude-website.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
