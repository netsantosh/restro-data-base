name: claude-website

# Builds the restaurant site from the two Google Sheets and deploys it to GitHub Pages.
#  - "Publish site" in the Content CMS sheet triggers this (workflow_dispatch)
#  - runs daily so scraper updates go live without a click
#  - runs when the site code in claude-website/ changes
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"      # 06:00 IST every day
  push:
    branches: [main]
    paths: ["claude-website/**", ".github/workflows/claude-website.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: claude-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claude-website/requirements.txt
      - run: pip install -r claude-website/requirements.txt
      - name: Restore photo cache (verified photos and known dead links)
        uses: actions/cache/restore@v4
        with:
          path: claude-website/photo_cache
          key: photo-cache-${{ github.run_id }}
          restore-keys: photo-cache-
      - name: Build site from the two Google Sheets
        working-directory: claude-website
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DB_SHEET_ID: ${{ secrets.DB_SHEET_ID }}
          CONTENT_SHEET_ID: ${{ secrets.CONTENT_SHEET_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          PHOTO_API: ${{ vars.PHOTO_API }}
          PHOTO_SYNC: "1"          # download + verify (HTTP 200) every photo, self-host it
          PHOTO_SELENIUM: "1"      # Selenium refreshes restaurants whose photos are all dead
        run: python build.py
      - name: Save photo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: claude-website/photo_cache
          key: photo-cache-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: claude-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
