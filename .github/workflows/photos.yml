name: photos

# Fills the photo cache. Every photo is downloaded, must answer HTTP 200, and must pass a content check
# (OpenCV, then a CLIP model that rejects selfies, profile pictures, letter avatars and logos).
# Selenium (headless Chrome) then looks for fresh photos on Google Maps for restaurants with too few.
# The work runs in three passes; after each pass the cache is saved and the site is rebuilt, so photos
# appear on the live site progressively instead of after one very long run.
# Review what was shown and rejected at <your site>/photo-audit/ after each deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"      # 23:30 IST every day

permissions:
  contents: read
  actions: write

concurrency:
  group: photos
  cancel-in-progress: false

env:
  PYTHONFAULTHANDLER: "1"
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DB_SHEET_ID: ${{ secrets.DB_SHEET_ID }}
  CONTENT_SHEET_ID: ${{ secrets.CONTENT_SHEET_ID }}
  PHOTO_SYNC: "1"

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claude-website/requirements-photos.txt
      - name: Install (includes the CLIP model libraries, CPU only)
        run: pip install -r claude-website/requirements-photos.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Cache the CLIP model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-laion2b-vit-b-32
      - name: Restore photo cache
        uses: actions/cache/restore@v4
        with:
          path: claude-website/photo_cache
          key: photo-cache-${{ github.run_id }}-0
          restore-keys: photo-cache-

      - name: Pass 1 of 3 (download, verify, content check)
        working-directory: claude-website
        env: { PHOTO_SELENIUM: "0", PHOTO_DOWNLOAD_MINUTES: "70" }
        run: python build.py --photos-only
      - name: Save cache (pass 1)
        if: always()
        uses: actions/cache/save@v4
        with: { path: claude-website/photo_cache, key: "photo-cache-${{ github.run_id }}-1" }
      - name: Publish site (pass 1)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run claude-website.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}

      - name: Pass 2 of 3 (continue)
        working-directory: claude-website
        env: { PHOTO_SELENIUM: "0", PHOTO_DOWNLOAD_MINUTES: "70" }
        run: python build.py --photos-only
      - name: Save cache (pass 2)
        if: always()
        uses: actions/cache/save@v4
        with: { path: claude-website/photo_cache, key: "photo-cache-${{ github.run_id }}-2" }
      - name: Publish site (pass 2)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run claude-website.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}

      - name: Pass 3 of 3 (Selenium refresh for restaurants with too few photos)
        working-directory: claude-website
        env: { PHOTO_SELENIUM: "1", PHOTO_DOWNLOAD_MINUTES: "60" }
        run: python build.py --photos-only
      - name: Save cache (pass 3)
        if: always()
        uses: actions/cache/save@v4
        with: { path: claude-website/photo_cache, key: "photo-cache-${{ github.run_id }}-3" }
      - name: Publish site (final)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run claude-website.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
